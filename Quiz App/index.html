<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="quiz-container">
        <h1>🧠 JavaScript Quiz</h1>

        <div class="quiz-header">
            <div class="top-info">
                <p id="questionNumber">Question 1 / 10</p>
                <div class="timer">
                    ⏱️ <span id="timer">10</span>s
                </div>
            </div>
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </div>

        <div class="quiz-box">
            <h2 id="question">
                Which language is used to style a web page?
            </h2>
            <div id="options" class="options">
                <button class="option">HTML</button>
                <button class="option">CSS</button>
                <button class="option">JavaScript</button>
                <button class="option">Python</button>
            </div>
            <button id="nextBtn">Next</button>
        </div>

        <div id="result" class="result">
            <h2>🎉 Quiz Complete!</h2>
            <p>Your Score</p>
            <h3 id="score">0 / 10</h3>
            <button id="restartBtn">Restart Quiz</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
