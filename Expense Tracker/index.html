<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <header>
            <h1>💰 Expense Tracker</h1>
            <p>Track your income and expenses</p>
        </header>


        <!-- Balance -->
        <section class="balance-card">
            <h3>Current Balance</h3>
            <h2 id="balance">₹0</h2>
        </section>


        <!-- Income & Expense -->
        <section class="summary">

            <div class="summary-card income">
                <h3>Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="summary-card expense">
                <h3>Expense</h3>
                <p id="expense">₹0</p>
            </div>

        </section>


        <!-- Add Transaction -->
        <section class="transaction-form">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">
                    <label for="title">Transaction Name</label>
                    <input type="text" id="title" placeholder="e.g. Food, Salary, Travel" required>
                </div>


                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" placeholder="Enter amount" min="1" required>
                </div>


                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>


                <button type="submit" class="add-btn">
                    + Add Transaction
                </button>

            </form>

        </section>


        <!-- Transaction History -->
        <section class="history">
            <h2>Transaction History</h2>
            <div id="transactionList">

                <!-- JavaScript will add transactions here -->

                <!-- Example transaction -->

                <div class="transaction income-transaction">
                    <div class="transaction-info">
                        <h3>Salary</h3>
                        <p>Income</p>
                    </div>
                    <div class="transaction-right">
                        <span class="amount">+ ₹20,000</span>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>


                <div class="transaction expense-transaction">
                    <div class="transaction-info">
                        <h3>Food</h3>
                        <p>Expense</p>
                    </div>
                    <div class="transaction-right">
                        <span class="amount">- ₹500</span>
                        <button class="delete-btn">Delete</button>
                    </div>
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
